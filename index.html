<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick and Morty Quiz</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #111;
      font-family: 'Nunito', sans-serif;
      color: #ddd;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container { width: 100%; max-width: 500px; }

    .tela { display: none; }
    .tela.ativa { display: block; }

    .cabecalho { text-align: center; margin-bottom: 22px; }
    .cabecalho h1 {
      font-family: 'Bangers', cursive;
      font-size: 50px;
      color: #00ff99;
      letter-spacing: 3px;
      line-height: 1;
    }
    .cabecalho p { color: #777; margin-top: 4px; font-size: 13px; }

    .card {
      background: #1a1a1a;
      border: 2px solid #00ff99;
      border-radius: 8px;
      padding: 24px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #00ff99;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      color: #fff;
      outline: none;
    }
    input[type="text"]:focus { border-color: #00ff99; }

    .opcoes-dificuldade { display: flex; gap: 8px; margin-top: 4px; }
    .opcao-dif {
      flex: 1; padding: 10px 8px;
      background: #222; border: 1px solid #444; border-radius: 6px;
      color: #aaa; font-family: 'Nunito', sans-serif;
      font-size: 13px; font-weight: 700; cursor: pointer; text-align: center;
    }
    .opcao-dif:hover { border-color: #00ff99; color: #fff; }
    .opcao-dif.selecionada { border-color: #00ff99; color: #00ff99; background: #1f2e26; }
    .opcao-dif .sub { display: block; font-size: 11px; font-weight: 400; color: #666; margin-top: 2px; }
    .opcao-dif.selecionada .sub { color: #66bb88; }

    .divider { height: 1px; background: #333; margin: 20px 0; }

    .btn {
      display: block; width: 100%; padding: 12px;
      background: #00ff99; color: #111;
      font-family: 'Bangers', cursive; font-size: 20px; letter-spacing: 2px;
      border: none; border-radius: 6px; cursor: pointer;
    }
    .btn:hover { background: #00dd88; }
    .btn-secundario {
      background: transparent; border: 1px solid #444;
      color: #aaa; margin-top: 10px; font-size: 16px;
    }
    .btn-secundario:hover { border-color: #00ff99; color: #00ff99; background: transparent; }

    .progresso-barra { height: 4px; background: #333; border-radius: 2px; margin-bottom: 18px; }
    .progresso-fill { height: 100%; background: #00ff99; border-radius: 2px; transition: width 0.3s; }

    .info-pergunta {
      display: flex; justify-content: space-between;
      font-size: 12px; color: #666; margin-bottom: 16px;
    }

    .silhueta-box { text-align: center; margin-bottom: 14px; }
    .silhueta-box img {
      width: 200px; height: 200px;
      object-fit: contain;
      filter: brightness(0.05);
      transition: filter 0.6s ease;
    }
    .silhueta-box img.revelada { filter: brightness(1); }

    .nome-personagem {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: #00ff99;
      margin-top: 6px;
      min-height: 30px;
      letter-spacing: 1px;
    }

    .pergunta-label {
      text-align: center;
      font-size: 14px;
      color: #888;
      margin-bottom: 14px;
    }

    .alternativas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .alternativa {
      padding: 11px 10px;
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      color: #ccc;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
    }
    .alternativa:hover:not(:disabled) { border-color: #00ff99; color: #fff; }
    .alternativa.correta { background: #1a3322; border-color: #00ff66; color: #00ff99; }
    .alternativa.errada { background: #2a1515; border-color: #ff4444; color: #ff6666; }
    .alternativa:disabled { cursor: default; }

    .feedback {
      text-align: center;
      font-family: 'Bangers', cursive;
      font-size: 24px;
      margin-top: 14px;
      min-height: 30px;
      letter-spacing: 1px;
    }
    .feedback.certo { color: #00ff99; }
    .feedback.errado { color: #ff4444; }

    .resultado-placar { text-align: center; padding: 16px 0; }
    .resultado-placar .acertos {
      font-family: 'Bangers', cursive; font-size: 68px; color: #00ff99; line-height: 1;
    }
    .resultado-placar .label-acertos { color: #666; font-size: 13px; margin-top: 4px; }
    .resultado-placar .pontos {
      font-family: 'Bangers', cursive; font-size: 32px; color: #ffe066; margin-top: 10px;
    }

    .ranking-lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .ranking-item {
      display: flex; align-items: center; gap: 12px;
      background: #222; border: 1px solid #333;
      border-radius: 6px; padding: 10px 14px;
    }
    .ranking-item:first-child { border-color: #ffe066; }
    .ranking-posicao {
      font-family: 'Bangers', cursive; font-size: 22px; color: #555; min-width: 28px; text-align: center;
    }
    .ranking-item:first-child .ranking-posicao { color: #ffe066; }
    .ranking-nome { font-weight: 700; color: #eee; flex: 1; font-size: 14px; }
    .ranking-dif { font-size: 11px; color: #666; display: block; font-weight: 400; }
    .ranking-pontos { font-family: 'Bangers', cursive; font-size: 20px; color: #ffe066; }

    .sem-ranking { text-align: center; color: #555; font-size: 14px; padding: 20px; }
    .msg-erro { color: #ff5555; font-size: 12px; margin-top: 6px; display: none; }
  </style>
</head>
<body>
<div class="container">

  <!-- TELA 1: PERFIL -->
  <div id="tela-perfil" class="tela ativa">
    <div class="cabecalho">
      <h1>RICK & MORTY</h1>
      <p>Você consegue reconhecer a silhueta?</p>
    </div>
    <div class="card">
      <div style="margin-bottom: 18px;">
        <label for="input-nome">Seu nome</label>
        <input type="text" id="input-nome" placeholder="Ex: Rick Sanchez" maxlength="30">
        <div class="msg-erro" id="erro-nome">Coloque seu nome antes de continuar.</div>
      </div>
      <div>
        <label>Dificuldade</label>
        <div class="opcoes-dificuldade">
          <button class="opcao-dif" onclick="selecionarDif('facil', this)">
            Fácil <span class="sub">4 perguntas</span>
          </button>
          <button class="opcao-dif" onclick="selecionarDif('media', this)">
            Médio <span class="sub">6 perguntas</span>
          </button>
          <button class="opcao-dif" onclick="selecionarDif('dificil', this)">
            Difícil <span class="sub">8 perguntas</span>
          </button>
        </div>
        <div class="msg-erro" id="erro-dif">Escolha uma dificuldade.</div>
      </div>
      <div class="divider"></div>
      <button class="btn" onclick="salvarPerfil()">COMEÇAR QUIZ</button>
      <button class="btn btn-secundario" onclick="irParaRanking()">🏆 Ver Ranking</button>
    </div>
  </div>

  
  <div id="tela-quiz" class="tela">
    <div class="cabecalho">
      <h1>QUEM É ESSE?</h1>
      <p id="label-jogador"></p>
    </div>
    <div class="card">
      <div class="progresso-barra">
        <div class="progresso-fill" id="barra-progresso"></div>
      </div>
      <div class="info-pergunta">
        <span id="info-numero"></span>
        <span id="info-dif"></span>
      </div>

      <div class="silhueta-box">
        <img id="img-personagem" src="" alt="personagem">
        <div class="nome-personagem" id="nome-personagem"></div>
      </div>

      <div class="pergunta-label">Qual é o nome deste personagem?</div>
      <div class="alternativas" id="alternativas"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  
  <div id="tela-resultado" class="tela">
    <div class="cabecalho"><h1>RESULTADO</h1></div>
    <div class="card">
      <div class="resultado-placar">
        <div class="acertos" id="res-acertos"></div>
        <div class="label-acertos" id="res-label"></div>
        <div class="pontos" id="res-pontos"></div>
      </div>
      <div class="divider"></div>
      <button class="btn" onclick="irParaRanking()">🏆 Ver Ranking</button>
      <button class="btn btn-secundario" onclick="jogarNovamente()">↩ Jogar Novamente</button>
    </div>
  </div>

  
  <div id="tela-ranking" class="tela">
    <div class="cabecalho">
      <h1>RANKING</h1>
      <p>Os maiores fãs da galáxia</p>
    </div>
    <div class="card">
      <div class="ranking-lista" id="ranking-lista"></div>
      <button class="btn btn-secundario" onclick="irParaPerfil()">← Voltar ao Perfil</button>
    </div>
  </div>

</div>

<script>
  
  var personagens = [];

  var perfil = { nome: "", dificuldade: "" };
  var quiz = { perguntas: [], indice: 0, acertos: 0 };

  function mostrarTela(id) {
    var telas = document.querySelectorAll(".tela");
    for (var i = 0; i < telas.length; i++) telas[i].classList.remove("ativa");
    document.getElementById(id).classList.add("ativa");
  }

  function irParaPerfil() { mostrarTela("tela-perfil"); carregarPerfil(); }
  function irParaRanking() { mostrarTela("tela-ranking"); renderizarRanking(); }
  function jogarNovamente() { mostrarTela("tela-perfil"); carregarPerfil(); }

  function selecionarDif(nivel, botao) {
    var bts = document.querySelectorAll(".opcao-dif");
    for (var i = 0; i < bts.length; i++) bts[i].classList.remove("selecionada");
    botao.classList.add("selecionada");
    perfil.dificuldade = nivel;
    document.getElementById("erro-dif").style.display = "none";
  }

  async function salvarPerfil() {
    var nome = document.getElementById("input-nome").value.trim();
    document.getElementById("erro-nome").style.display = "none";
    document.getElementById("erro-dif").style.display = "none";
    var ok = true;
    if (!nome) { document.getElementById("erro-nome").style.display = "block"; ok = false; }
    if (!perfil.dificuldade) { document.getElementById("erro-dif").style.display = "block"; ok = false; }
    if (!ok) return;
    perfil.nome = nome;
    localStorage.setItem("rm_perfil", JSON.stringify(perfil));
    await iniciarQuiz();
  }

  function carregarPerfil() {
    var salvo = localStorage.getItem("rm_perfil");
    if (!salvo) return;
    var dados = JSON.parse(salvo);
    document.getElementById("input-nome").value = dados.nome;
    perfil.nome = dados.nome;
    var bts = document.querySelectorAll(".opcao-dif");
    var niveis = ["facil", "media", "dificil"];
    for (var i = 0; i < bts.length; i++) {
      if (niveis[i] === dados.dificuldade) {
        bts[i].classList.add("selecionada");
        perfil.dificuldade = dados.dificuldade;
      }
    }
  }

  
  
  async function carregarPersonagens() {
    try {
      var resposta = await fetch("https://rickandmortyapi.com/api/character/?page=1");
      if (!resposta.ok) throw new Error("Falha na requisição: " + resposta.status);
      var dados = await resposta.json();
      personagens = dados.results.map(function(p) {
        return { id: p.id, nome: p.name };
      });
    } catch (erro) {
      console.error("Erro ao buscar personagens na API:", erro);
      alert("Não foi possível carregar os personagens. Verifique sua conexão e recarregue a página.");
    }
  }

  function embaralhar(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  async function iniciarQuiz() {
    if (personagens.length === 0) {
      await carregarPersonagens();
    }
    if (personagens.length === 0) return; 

    var quantidade = 4;
    if (perfil.dificuldade === "media") quantidade = 6;
    if (perfil.dificuldade === "dificil") quantidade = 8;

    var pool = embaralhar(personagens);
    var selecionados = pool.slice(0, quantidade);

    quiz.perguntas = [];
    for (var i = 0; i < selecionados.length; i++) {
      var correto = selecionados[i];
      var errados = [];
      for (var k = 0; k < pool.length; k++) {
        if (pool[k].id !== correto.id) errados.push(pool[k].nome);
        if (errados.length === 3) break;
      }
      var opcoes = embaralhar([correto.nome, errados[0], errados[1], errados[2]]);
      quiz.perguntas.push({
        id: correto.id,
        nome: correto.nome,
        opcoes: opcoes,
        correta: opcoes.indexOf(correto.nome)
      });
    }

    quiz.indice = 0;
    quiz.acertos = 0;

    mostrarTela("tela-quiz");
    document.getElementById("label-jogador").textContent = "Boa sorte, " + perfil.nome + "!";
    renderizarPergunta();
  }

  function renderizarPergunta() {
    var p = quiz.perguntas[quiz.indice];
    var total = quiz.perguntas.length;
    var numero = quiz.indice + 1;

    document.getElementById("barra-progresso").style.width = (((numero - 1) / total) * 100) + "%";
    document.getElementById("info-numero").textContent = "Pergunta " + numero + " de " + total;
    document.getElementById("info-dif").textContent = nomeDif(perfil.dificuldade);

    var img = document.getElementById("img-personagem");
    img.classList.remove("revelada");
    img.src = "https://rickandmortyapi.com/api/character/avatar/" + p.id + ".jpeg";

    document.getElementById("nome-personagem").textContent = "";
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").className = "feedback";

    var altDiv = document.getElementById("alternativas");
    altDiv.innerHTML = "";
    for (var i = 0; i < p.opcoes.length; i++) {
      var btn = document.createElement("button");
      btn.className = "alternativa";
      btn.textContent = p.opcoes[i];
      btn.dataset.indice = i;
      btn.onclick = responder;
      altDiv.appendChild(btn);
    }
  }

  function responder(evento) {
    var escolhido = parseInt(evento.target.dataset.indice);
    var p = quiz.perguntas[quiz.indice];

    var bts = document.querySelectorAll(".alternativa");
    for (var i = 0; i < bts.length; i++) {
      bts[i].disabled = true;
      if (i === p.correta) bts[i].classList.add("correta");
      else if (i === escolhido) bts[i].classList.add("errada");
    }

    document.getElementById("img-personagem").classList.add("revelada");
    document.getElementById("nome-personagem").textContent = p.nome;

    var fb = document.getElementById("feedback");
    if (escolhido === p.correta) {
      quiz.acertos++;
      fb.textContent = "✓ ACERTOU!";
      fb.className = "feedback certo";
    } else {
      fb.textContent = "✗ ERROU!";
      fb.className = "feedback errado";
    }

    setTimeout(proximaPergunta, 2200);
  }

  function proximaPergunta() {
    quiz.indice++;
    if (quiz.indice < quiz.perguntas.length) {
      renderizarPergunta();
    } else {
      mostrarResultado();
    }
  }

  function nomeDif(nivel) {
    if (nivel === "facil") return "🟢 Fácil";
    if (nivel === "media") return "🟡 Médio";
    return "🔴 Difícil";
  }

  function mostrarResultado() {
    var acertos = quiz.acertos;
    var total = quiz.perguntas.length;
    var pontos = acertos * 10;
    document.getElementById("res-acertos").textContent = acertos + "/" + total;
    document.getElementById("res-label").textContent = "personagens identificados";
    document.getElementById("res-pontos").textContent = "+" + pontos + " PONTOS";
    salvarRanking(perfil.nome, pontos, perfil.dificuldade);
    mostrarTela("tela-resultado");
  }

  function salvarRanking(nome, pontos, dificuldade) {
    var ranking = carregarRanking();
    var achou = false;
    for (var i = 0; i < ranking.length; i++) {
      if (ranking[i].nome === nome) {
        if (pontos > ranking[i].pontos) { ranking[i].pontos = pontos; ranking[i].dificuldade = dificuldade; }
        achou = true;
        break;
      }
    }
    if (!achou) ranking.push({ nome: nome, pontos: pontos, dificuldade: dificuldade });
    ranking.sort(function(a, b) { return b.pontos - a.pontos; });
    localStorage.setItem("rm_ranking", JSON.stringify(ranking));
  }

  function carregarRanking() {
    var salvo = localStorage.getItem("rm_ranking");
    return salvo ? JSON.parse(salvo) : [];
  }

  function renderizarRanking() {
    var ranking = carregarRanking();
    var lista = document.getElementById("ranking-lista");
    lista.innerHTML = "";
    if (ranking.length === 0) {
      lista.innerHTML = '<div class="sem-ranking">Nenhum resultado ainda. Seja o primeiro! 🚀</div>';
      return;
    }
    for (var i = 0; i < ranking.length; i++) {
      var item = ranking[i];
      var div = document.createElement("div");
      div.className = "ranking-item";
      var emoji = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : (i + 1)));
      div.innerHTML =
        '<div class="ranking-posicao">' + emoji + '</div>' +
        '<div class="ranking-nome">' + item.nome +
          '<span class="ranking-dif">' + nomeDif(item.dificuldade) + '</span>' +
        '</div>' +
        '<div class="ranking-pontos">' + item.pontos + ' pts</div>';
      lista.appendChild(div);
    }
  }

  carregarPerfil();
  carregarPersonagens(); 
</script>
</body>
</html>
